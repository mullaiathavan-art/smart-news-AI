<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e3a8a" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="100%" stopColor="#2563eb" />
    </linearGradient>
  </defs>
  
  <!-- Solid Background with Rounded corners for standard icon -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)"/>

  <g transform="translate(56, 56) scale(4)">
    <!-- Outer Hex Frame -->
    <path 
      d="M50 5L90 27.5V72.5L50 95L10 72.5V27.5L50 5Z" 
      stroke="#60a5fa" 
      strokeWidth="5" 
      strokeLinecap="round" 
      strokeLinejoin="round"
      opacity="0.4"
    />
    
    <!-- News Sheet Abstract -->
    <rect x="24" y="28" width="52" height="42" rx="5" fill="url(#logo-grad)" />
    <rect x="31" y="38" width="38" height="4" rx="2" fill="#ffffff" fill-opacity="0.9" />
    <rect x="31" y="48" width="28" height="4" rx="2" fill="#ffffff" fill-opacity="0.9" />
    <rect x="31" y="58" width="38" height="4" rx="2" fill="#ffffff" fill-opacity="0.9" />
    
    <!-- Verification Scanning Ring -->
    <circle 
      cx="66" 
      cy="66" 
      r="20" 
      stroke="#10b981" 
      strokeWidth="5" 
      fill="#ffffff" 
    />
    
    <!-- Central Check in Ring -->
    <path 
      d="M59 66L64 71L73 62" 
      stroke="#10b981" 
      strokeWidth="4.5" 
      strokeLinecap="round" 
      strokeLinejoin="round"
    />
    
    <!-- Tech Corner Accents -->
    <path d="M14 34L14 24L24 24" stroke="#93c5fd" strokeWidth="2.5" stroke-linecap="round" />
    <path d="M86 66L86 76L76 76" stroke="#93c5fd" strokeWidth="2.5" stroke-linecap="round" />
  </g>
</svg>
